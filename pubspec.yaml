name: itarbiatbadani_app
description: اپلیکیشن تربیت بدنی و علوم ورزشی
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  http: ^1.2.2
  url_launcher: ^6.3.1
  flutter_inappwebview: ^6.1.5
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#07131f"
  image: assets/images/logo.png
  color_dark: "#07131f"
  image_dark: assets/images/logo.png
  android_12:
    color: "#07131f"
    image: assets/images/logo.png
    icon_background_color: "#07131f"
    color_dark: "#07131f"
    image_dark: assets/images/logo.png
    icon_background_color_dark: "#07131f"
  android: true
  ios: false
  fullscreen: true
