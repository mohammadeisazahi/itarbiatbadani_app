name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Create android folder
        run: |
          flutter create --platforms=android --project-name itarbiatbadani --org ir --no-pub .
          echo "✅ android folder created"

      - name: Clean Flutter cache
        run: |
          flutter clean
          rm -f pubspec.lock
          echo "✅ Cleaned cache"

      - name: Download Vazirmatn Fonts
        run: |
          mkdir -p assets/fonts
          curl -L -o assets/fonts/Vazirmatn-Regular.ttf \
            https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Regular.ttf
          curl -L -o assets/fonts/Vazirmatn-Bold.ttf \
            https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Bold.ttf
          ls -la assets/fonts/
          echo "✅ Fonts downloaded"

      - name: Inject WooCommerce Keys
        run: |
          sed -i "s|YOUR_WC_KEY|${{ secrets.WC_KEY }}|g" lib/main.dart
          sed -i "s|YOUR_WC_SECRET|${{ secrets.WC_SECRET }}|g" lib/main.dart
          echo "✅ WooCommerce keys injected"

      - name: Add INTERNET permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="[^"]*"/android:label="تربیت بدنی و علوم ورزشی"/' $MANIFEST
          python3 -c "
          path = '$MANIFEST'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          if 'android.permission.INTERNET' not in content:
              content = content.replace(
                  '<application',
                  '<uses-permission android:name=\"android.permission.INTERNET\" />\n    <application',
                  1
              )
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('✅ INTERNET permission added')
          else:
              print('✅ INTERNET permission already exists')
          "
          cat $MANIFEST

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate launcher icons
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        continue-on-error: true
        run: dart run flutter_native_splash:create

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: itarbiatbadani-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            pubspec.lock
            android/app/build.gradle
            android/app/src/main/AndroidManifest.xml
