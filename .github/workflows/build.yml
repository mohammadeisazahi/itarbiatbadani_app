name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Create android folder
        run: |
          flutter create --platforms=android --project-name itarbiatbadani --org ir --no-pub .
          echo "✅ android folder created"

      - name: Clean Flutter cache
        run: |
          flutter clean
          rm -f pubspec.lock
          echo "✅ Cleaned cache"

      - name: Download Vazirmatn Fonts
        run: |
          mkdir -p assets/fonts
          curl -L -o assets/fonts/Vazirmatn-Regular.ttf \
            https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf/Vazirmatn-Regular.ttf
          curl -L -o assets/fonts/Vazirmatn-Bold.ttf \
            https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf/Vazirmatn-Bold.ttf
          ls -la assets/fonts/
          echo "✅ Fonts downloaded"

      - name: Upgrade AGP and Gradle
        run: |
          echo "🔧 Upgrading AGP and Gradle..."
          
          if [ -f "android/settings.gradle" ]; then
            sed -i 's/version "8.1.0"/version "8.3.0"/g' android/settings.gradle || true
            sed -i "s/version '8.1.0'/version '8.3.0'/g" android/settings.gradle || true
            sed -i 's/version "8.1.1"/version "8.3.0"/g' android/settings.gradle || true
            sed -i "s/version '8.1.1'/version '8.3.0'/g" android/settings.gradle || true
            echo "✅ settings.gradle updated"
          fi
          
          if [ -f "android/build.gradle" ]; then
            sed -i 's/com.android.tools.build:gradle:8.1.0/com.android.tools.build:gradle:8.3.0/g' android/build.gradle || true
            sed -i 's/com.android.tools.build:gradle:8.1.1/com.android.tools.build:gradle:8.3.0/g' android/build.gradle || true
            echo "✅ build.gradle updated"
          fi
          
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's|gradle-7.6-all.zip|gradle-8.4-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties || true
            sed -i 's|gradle-8.0-all.zip|gradle-8.4-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties || true
            sed -i 's|gradle-8.1-all.zip|gradle-8.4-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties || true
            sed -i 's|gradle-8.2-all.zip|gradle-8.4-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties || true
            sed -i 's|gradle-8.3-all.zip|gradle-8.4-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties || true
            echo "✅ gradle-wrapper.properties updated"
          fi

      - name: Rewrite build.gradle with Desugaring
        run: |
          FILE="android/app/build.gradle"
          if [ -f "$FILE" ]; then
            cat > "$FILE" << 'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }

          def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
          if (flutterVersionCode == null) {
              flutterVersionCode = '1'
          }

          def flutterVersionName = localProperties.getProperty('flutter.versionName')
          if (flutterVersionName == null) {
              flutterVersionName = '1.0'
          }

          android {
              namespace "ir.itarbiatbadani.itarbiatbadani_app"
              compileSdkVersion flutter.compileSdkVersion
              ndkVersion flutter.ndkVersion

              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }

              sourceSets {
                  main.java.srcDirs += 'src/main/kotlin'
              }

              defaultConfig {
                  applicationId "ir.itarbiatbadani.itarbiatbadani_app"
                  minSdkVersion 21
                  targetSdkVersion flutter.targetSdkVersion
                  versionCode flutterVersionCode.toInteger()
                  versionName flutterVersionName
                  multiDexEnabled true
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source '../..'
          }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
              implementation 'androidx.multidex:multidex:2.0.1'
          }
          EOF
            echo "✅ build.gradle بازنویسی شد"
            cat "$FILE"
          else
            echo "❌ فایل پیدا نشد"
            exit 1
          fi

      - name: Inject WooCommerce Keys
        run: |
          sed -i "s|YOUR_WC_KEY|${{ secrets.WC_KEY }}|g" lib/main.dart || true
          sed -i "s|YOUR_WC_SECRET|${{ secrets.WC_SECRET }}|g" lib/main.dart || true
          echo "✅ WooCommerce keys injected"

      - name: Add Permissions to Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="[^"]*"/android:label="تربیت بدنی و علوم ورزشی"/' $MANIFEST
          python3 -c "
          path = '$MANIFEST'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          permissions = [
              'android.permission.INTERNET',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.VIBRATE',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.USE_EXACT_ALARM',
          ]

          for perm in permissions:
              if perm not in content:
                  content = content.replace(
                      '<application',
                      f'<uses-permission android:name=\"{perm}\" />\n    <application',
                      1
                  )
                  print(f'✅ {perm} added')
              else:
                  print(f'✅ {perm} already exists')

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          "
          cat $MANIFEST

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate launcher icons
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        continue-on-error: true
        run: dart run flutter_native_splash:create

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: itarbiatbadani-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            pubspec.lock
            android/app/build.gradle
            android/app/src/main/AndroidManifest.xml
            android/settings.gradle
            android/build.gradle
            android/gradle/wrapper/gradle-wrapper.properties
