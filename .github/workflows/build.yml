name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Create android folder (if missing)
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name itarbiatbadani --org ir --no-pub .
            echo "✅ android folder created"
          else
            echo "✅ android folder already exists (skipped)"
          fi

      - name: Clean Flutter cache
        run: |
          flutter clean
          rm -f pubspec.lock
          echo "✅ Cleaned cache"

      # ✅ دانلود همه ۶ وزن فونت
      - name: Download Vazirmatn Fonts (all weights)
        run: |
          mkdir -p assets/fonts
          BASE="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf"
          echo "📥 Downloading Regular..."
          curl -L -o assets/fonts/Vazirmatn-Regular.ttf   "$BASE/Vazirmatn-Regular.ttf"
          echo "📥 Downloading Medium..."
          curl -L -o assets/fonts/Vazirmatn-Medium.ttf    "$BASE/Vazirmatn-Medium.ttf"
          echo "📥 Downloading SemiBold..."
          curl -L -o assets/fonts/Vazirmatn-SemiBold.ttf  "$BASE/Vazirmatn-SemiBold.ttf"
          echo "📥 Downloading Bold..."
          curl -L -o assets/fonts/Vazirmatn-Bold.ttf      "$BASE/Vazirmatn-Bold.ttf"
          echo "📥 Downloading ExtraBold..."
          curl -L -o assets/fonts/Vazirmatn-ExtraBold.ttf "$BASE/Vazirmatn-ExtraBold.ttf"
          echo "📥 Downloading Black..."
          curl -L -o assets/fonts/Vazirmatn-Black.ttf     "$BASE/Vazirmatn-Black.ttf"
          echo "📁 Fonts directory:"
          ls -la assets/fonts/
          echo "✅ All 6 font weights downloaded"

      # ✅ بررسی وجود لوگو
      - name: Verify logo exists
        run: |
          mkdir -p assets/images
          if [ ! -f "assets/images/logo.png" ]; then
            echo "⚠️ logo.png not found in repo, downloading from site..."
            curl -L -o assets/images/logo.png \
              "https://itarbiatbadani.ir/wp-content/uploads/2025/07/1000073463.png"
          fi
          echo "📁 Images directory:"
          ls -la assets/images/
          echo "✅ Logo ready"

      - name: Upgrade AGP and Gradle
        run: |
          echo "🔧 Upgrading AGP and Gradle..."
          
          if [ -f "android/settings.gradle" ]; then
            sed -i 's/version "8.1.0"/version "8.3.0"/g' android/settings.gradle || true
            sed -i "s/version '8.1.0'/version '8.3.0'/g" android/settings.gradle || true
            sed -i 's/version "8.1.1"/version "8.3.0"/g' android/settings.gradle || true
            sed -i "s/version '8.1.1'/version '8.3.0'/g" android/settings.gradle || true
            echo "✅ settings.gradle updated"
          fi
          
          if [ -f "android/build.gradle" ]; then
            sed -i 's/com.android.tools.build:gradle:8.1.0/com.android.tools.build:gradle:8.3.0/g' android/build.gradle || true
            sed -i 's/com.android.tools.build:gradle:8.1.1/com.android.tools.build:gradle:8.3.0/g' android/build.gradle || true
            echo "✅ build.gradle updated"
          fi
          
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's|gradle-7.6-all.zip|gradle-8.4-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties || true
            sed -i 's|gradle-8.0-all.zip|gradle-8.4-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties || true
            sed -i 's|gradle-8.1-all.zip|gradle-8.4-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties || true
            sed -i 's|gradle-8.2-all.zip|gradle-8.4-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties || true
            sed -i 's|gradle-8.3-all.zip|gradle-8.4-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties || true
            echo "✅ gradle-wrapper.properties updated"
          fi

      - name: Add namespace to gradle (if needed)
        run: |
          if [ -f "android/app/build.gradle" ]; then
            if ! grep -q "namespace" android/app/build.gradle; then
              sed -i '/android {/a\    namespace "ir.itarbiatbadani.itarbiatbadani_app"' android/app/build.gradle || true
              echo "✅ namespace added"
            else
              echo "✅ namespace already exists"
            fi
          fi

      - name: Inject WooCommerce Keys
        run: |
          sed -i "s|YOUR_WC_KEY|${{ secrets.WC_KEY }}|g" lib/main.dart || true
          sed -i "s|YOUR_WC_SECRET|${{ secrets.WC_SECRET }}|g" lib/main.dart || true
          echo "✅ WooCommerce keys injected"

      - name: Add Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # تغییر نام اپ
          sed -i 's/android:label="[^"]*"/android:label="تربیت بدنی و علوم ورزشی"/' $MANIFEST
          
          python3 << 'PYTHON_SCRIPT'
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          
          # لیست مجوزهای مورد نیاز
          permissions = [
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.WRITE_EXTERNAL_STORAGE',
              'android.permission.READ_EXTERNAL_STORAGE',
          ]
          
          # اضافه کردن هر مجوز اگر وجود ندارد
          for perm in permissions:
              if perm not in content:
                  content = content.replace(
                      '<application',
                      f'<uses-permission android:name="{perm}" />\n    <application',
                      1
                  )
                  print(f'✅ Added: {perm}')
              else:
                  print(f'✔️ Already exists: {perm}')
          
          # اضافه کردن usesCleartextTraffic (برای HTTP)
          if 'usesCleartextTraffic' not in content:
              content = content.replace(
                  'android:label=',
                  'android:usesCleartextTraffic="true"\n        android:label=',
                  1
              )
              print('✅ Added usesCleartextTraffic')
          
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          
          print('\n📄 Final AndroidManifest.xml:')
          print('=' * 50)
          print(content)
          PYTHON_SCRIPT

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate launcher icons
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        continue-on-error: true
        run: dart run flutter_native_splash:create

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: itarbiatbadani-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            pubspec.lock
            android/app/build.gradle
            android/app/src/main/AndroidManifest.xml
            android/settings.gradle
            android/build.gradle
            android/gradle/wrapper/gradle-wrapper.properties
